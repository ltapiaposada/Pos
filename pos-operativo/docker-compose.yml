services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    environment:
      APP_NAME: POS
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: pos
      DB_USERNAME: pos
      DB_PASSWORD: secret
      SEED_DEMO_DATA: "false"
      POS_INITIAL_ADMIN_NAME: Administrador
      POS_INITIAL_ADMIN_EMAIL: admin@cliente.local
      POS_INITIAL_ADMIN_PASSWORD: Cambiame123!
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - storage_data:/var/www/html/storage

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: pos
      MYSQL_USER: pos
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
  storage_data:
